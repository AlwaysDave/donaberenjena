<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00B5E8" />
      <stop offset="100%" stop-color="#0077C8" />
    </linearGradient>
    <linearGradient id="fav-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="fav-magenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E91E83" />
      <stop offset="100%" stop-color="#9B0058" />
    </linearGradient>
    <linearGradient id="fav-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BC34A" />
      <stop offset="100%" stop-color="#43A047" />
    </linearGradient>
    <linearGradient id="fav-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="128" height="128" rx="28" fill="#FBF9F5" />
  
  <!-- 1. Blue Tile (left vertical) -->
  <rect x="10" y="10" width="30" height="108" rx="8" fill="url(#fav-blue)" />
  <rect x="10" y="10" width="30" height="108" rx="8" fill="url(#fav-gloss)" />
  <!-- Spoon -->
  <ellipse cx="25" cy="30" rx="6" ry="9" fill="#FFFFFF" />
  <rect x="23.5" y="38" width="3" height="18" fill="#FFFFFF" />
  <!-- 'b' -->
  <rect x="16" y="80" width="4" height="26" rx="1.5" fill="#FFFFFF" />
  <circle cx="25" cy="94" r="8" fill="none" stroke="#FFFFFF" stroke-width="4" />

  <!-- 2. Orange Tile (Fork) -->
  <rect x="46" y="10" width="34" height="34" rx="8" fill="url(#fav-orange)" />
  <rect x="46" y="10" width="34" height="34" rx="8" fill="url(#fav-gloss)" />
  <rect x="53" y="15" width="2" height="12" rx="1" fill="#FFFFFF" />
  <rect x="58" y="15" width="2" height="12" rx="1" fill="#FFFFFF" />
  <rect x="63" y="15" width="2" height="12" rx="1" fill="#FFFFFF" />
  <rect x="68" y="15" width="2" height="12" rx="1" fill="#FFFFFF" />
  <path d="M53 24 C53 30, 68 30, 68 24 L68 28 C68 33, 62 33, 61 33 L61 40 L59 40 L59 33 C58 33, 53 33, 53 28 Z" fill="#FFFFFF" />

  <!-- 3. Magenta Tile (Knife) -->
  <rect x="86" y="10" width="34" height="34" rx="8" fill="url(#fav-magenta)" />
  <rect x="86" y="10" width="34" height="34" rx="8" fill="url(#fav-gloss)" />
  <path d="M100 15 C100 15, 96 28, 93 34 L103 34 L103 15 Z" fill="#FFFFFF" />
  <rect x="99" y="34" width="4" height="6" fill="#FFFFFF" />

  <!-- 4. Green Tile (Wine Glass) -->
  <rect x="46" y="50" width="74" height="68" rx="12" fill="url(#fav-green)" />
  <rect x="46" y="50" width="74" height="68" rx="12" fill="url(#fav-gloss)" />
  <path d="M68 60 L98 60 C99 76, 97 88, 85 90 L81 90 C69 88, 67 76, 68 60 Z" fill="#FFFFFF" />
  <rect x="81" y="90" width="4" height="16" fill="#FFFFFF" />
  <ellipse cx="83" cy="107" rx="14" ry="2" fill="#FFFFFF" />
</svg>
